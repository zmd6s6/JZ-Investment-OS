  # Planner补货，仅本PR实际合入Release后可Claim；既有项状态保持原值。
  - id: MVP-405
    title: Read-only operational inbox on the product dashboard
    priority: 1
    status: REVIEW
    claim_branch: agent/MVP-405
    claim_owner: pr-02-review-and-next-stage-monitor / root
    # 原create-only Claim及PR47由已结束connector开发者建立，恢复唯一执行权见Handoff。
    stage: PRODUCT-08
    checkpoint: C
    depends_on:
      - MVP-206
      - MVP-403
      - MVP-404
    scope:
      - Add a bounded read-only operational inbox to the home dashboard using a typed application read port and real persisted Decision, DailyReport and TaskRun sources.
      - Show action-required, hold/watch, new-opportunity, Risk Veto, pending approvals and data/job-degraded sections with source IDs, observation time and supported detail links.
      - Derive operational attention only from recorded status, not investment judgement; unsupported investment sections remain explicitly NOT_PROVIDED or UNKNOWN. An empty successful read differs from source failure.
      - Refresh rereads actual local persisted state; paginated or bounded results disclose limits and do not present partial counts as totals. Reading must not enqueue, retry, approve, activate or call providers.
    acceptance:
      route: /
      expected: Owner can refresh the dashboard, identify persisted pending approvals and failed/degraded runs, and open the original decision/report detail. Missing sections and source failure show Chinese explanations while readable sections remain usable.
      failure_conditions:
        - Source timeout, unavailable or malformed references show an explicit section error without fabricated zero/success or sensitive payload.
        - Expired, revoked or completed approval history must not appear as currently eligible pending approval; never offer approval directly from the inbox.
        - Empty database shows an honest empty state; unsupported investment interpretation shows NOT_PROVIDED rather than inferred HOLD/WATCH/BUY.
      required_evidence:
        - Named normal, failure and boundary tests with actual PostgreSQL/API reads, bounded results and no side effects.
        - Synthetic production API and browser flow proving refresh, detail navigation, empty/degraded states and narrow layout; real Worker-produced run history where used.
    owner_decision: NONE

  # Planner补货，仅本PR实际合入Release后可Claim；既有15项保持原值。
  - id: MVP-406
    title: Fair daily runtime scanning and reachable authorization and report history
    priority: 1
    status: IN_PROGRESS
    claim_branch: agent/MVP-406
    claim_owner: pr-02-review-and-next-stage-monitor / stagnation_planner
    stage: PRODUCT-08
    checkpoint: C
    depends_on:
      - MVP-403
    scope:
      - Close the persisted daily runtime starvation gap for enabled configurations beyond the fixed first 50 and pending report finalization beyond the newest 50 executions, retaining bounded work per poll and existing authorization and idempotency fences.
      - Add typed bounded pagination and exact-record reads for daily configurations, TaskRun history and report audit history, preserving existing callers and immutable records. Expired report bodies remain unavailable while permitted audit metadata remains reachable.
      - Connect the daily calendar UI to load more records, locate the original configuration or report and explicitly pause or revoke a selected older authorization using its current version and existing confirmation gate.
      - Document scheduling cursor and recovery semantics in a new ADR and verify any migration against the actual merged single-head chain. No changed investment policy, provider scope, budget, automatic retries of uncertain paid work or real external calls.
    acceptance:
      route: /calendar
      expected: Owner can reach an older daily authorization and its actual task/report history, explicitly pause or revoke it, and refresh to verify the persisted result. Real Worker eventually checks every eligible configuration and finalizes reachable pending reports within bounded polling, including records outside the original first page.
      failure_conditions:
        - Source failure, invalid pagination or missing exact ID shows a Chinese error and never a fabricated empty or successful result; failed reads cannot enable state-changing controls from stale records.
        - Expired or malformed reports retain permitted audit provenance but their business bodies cannot be displayed or reused. Original hashes and append-only history remain unchanged.
        - Pause, revoke, authorization expiry, scope or calendar changes and concurrent Workers retain the existing final authorization checks, bounded retry and unique business effect. A cursor never grants authorization or replays uncertain model calls.
      required_evidence:
        - Named PostgreSQL tests for more than 50 configurations and pending executions, stable bounded pagination, restart and concurrent Worker fairness, terminal report uniqueness, expiry and zero side effects on reads.
        - Synthetic production API, database, real Worker and browser demonstration of a tail configuration producing a real report, older-history navigation, explicit pause or revoke, refresh persistence, read failure recovery and narrow layout.
        - Full required checks, generated OpenAPI compatibility and reversible cursor migration or tested forward-fix evidence, followed by an independent final-HEAD Review Gate.
    owner_decision: NONE

