  - id: MVP-204
    title: Analysis trace UI
    priority: 1
    status: INTEGRATED
    claim_branch: agent/MVP-204
    claim_owner: pr-02-review-and-next-stage-monitor / mvp204_trace
    # 此状态仅随MVP-204 PR通过独立Gate且实际合入Release生效；不是完整P6或Owner接受。
