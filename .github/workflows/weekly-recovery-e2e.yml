name: Weekly authorization recovery E2E

on:
  pull_request:
    paths:
      - '.github/workflows/weekly-recovery-e2e.yml'
      - 'src/investment_os/**'
      - 'web/**'
      - 'scripts/weekly_recovery_e2e_stack.py'
      - 'tests/integration/test_weekly_review*.py'
      - 'migrations/**'
      - 'uv.lock'
  push:
    branches: [agent/MVP-408, release/mvp-beta]

permissions:
  contents: read

jobs:
  weekly-recovery-real-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mvp408_recovery_synthetic
          POSTGRES_USER: investment_os
          POSTGRES_PASSWORD: local-development-only # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U investment_os -d mvp408_recovery_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BASE_URL: http://127.0.0.1:18165
      E2E_WRITE_TOKEN: synthetic-weekly-only
      WEEKLY_SYNTHETIC_DATABASE_URL: postgresql+asyncpg://investment_os:local-development-only@127.0.0.1:5432/mvp408_recovery_synthetic # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - name: Named real PostgreSQL weekly authorization and recovery boundaries
        env:
          INVESTMENT_OS_TEST_DATABASE_URL: postgresql+asyncpg://investment_os:local-development-only@127.0.0.1:5432/mvp408_recovery_tests_synthetic # pragma: allowlist secret
        run: |
          uv run python - <<'PY'
          import asyncio, os, asyncpg
          async def create_only():
              connection = await asyncpg.connect(os.environ["WEEKLY_SYNTHETIC_DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://", 1))
              try:
                  await connection.execute('CREATE DATABASE mvp408_recovery_tests_synthetic')
              finally:
                  await connection.close()
          asyncio.run(create_only())
          PY
          uv run pytest tests/unit/test_weekly_review_contract.py tests/unit/test_weekly_mode_consent_window.py tests/unit/test_weekly_schedule.py tests/integration/test_weekly_review_pipeline.py tests/integration/test_weekly_review_concurrency.py tests/integration/test_weekly_local_schema.py tests/integration/test_weekly_local_mode.py --no-cov
      - name: Start actual API and CLI Worker with synthetic source drift
        shell: bash
        run: |
          mkdir -p .runtime
          uv run python scripts/weekly_recovery_e2e_stack.py --port 18165 --database-url "$WEEKLY_SYNTHETIC_DATABASE_URL" > .runtime/mvp408-recovery-api.log 2>&1 &
          echo $! > .runtime/mvp408-recovery-stack.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(150):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18165/health/ready', timeout=2) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Synthetic weekly API/Worker stack did not become ready')
          PY
      - name: UI same-task recovery after three actual Worker failures
        working-directory: web
        run: npx playwright test weekly-recovery.spec.ts --workers=1 --reporter=list
      - name: Connect original weekly regression to the same actual CLI Worker stack
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          fixture = json.loads(Path('.runtime/mvp408-recovery-fixture.json').read_text())
          Path('.runtime/mvp408-browser-fixture.json').write_text(json.dumps({'ids': {'portfolio': fixture['portfolio_id']}}))
          PY
      - name: Original weekly configuration, failed reads, pagination, narrow UI and baseline regression
        working-directory: web
        run: npx playwright test weekly-review.spec.ts --workers=1 --reporter=list
      - name: Synthetic diagnostics on failure
        if: failure()
        run: tail -n 100 .runtime/mvp408-recovery-api.log .runtime/mvp408-recovery-worker.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-recovery-browser-evidence
          path: |
            .runtime/mvp408-*.png
            .runtime/mvp408-recovery-fixture.json
            .runtime/mvp408-browser-fixture.json
            .runtime/mvp408-recovery-api.log
            .runtime/mvp408-recovery-worker.log
            web/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop dedicated synthetic stack
        if: always()
        run: test ! -f .runtime/mvp408-recovery-stack.pid || kill "$(cat .runtime/mvp408-recovery-stack.pid)" || true
