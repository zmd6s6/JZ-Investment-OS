name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv run python scripts/check_domain_coverage.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run python scripts/export_policy_schema.py --check
      - run: docker compose config
      - run: uv run pip-audit
      - run: uv run pip-licenses --format=markdown --with-urls
      - run: uv run python scripts/check_secrets.py

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: docker compose up --build --detach --wait
      - run: uv run python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
